<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Hamper Box Parcel Tracking</title>

  <meta name="description"
        content="Hamper Box Parcel Tracking - Enter your registered mobile number to check parcel status.">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    .container {
      width: 100%;
      max-width: 760px;
      margin: auto;
      padding: 45px 20px 30px;
    }

    .brand {
      text-align: center;
      font-size: 48px;
      font-weight: 800;
      color: #166534;
      margin-bottom: 25px;
    }

    .brand span {
      vertical-align: middle;
    }

    h1 {
      text-align: center;
      font-size: 48px;
      margin: 0 0 35px;
      font-weight: 800;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      font-size: 25px;
      line-height: 1.5;
      margin: 0 auto 45px;
      max-width: 700px;
    }

    .track-box {
      background: white;
      border-radius: 30px;
      padding: 40px 35px 30px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    }

    label {
      display: block;
      font-size: 25px;
      font-weight: 700;
      margin-bottom: 18px;
    }

    input {
      width: 100%;
      height: 95px;
      border: 1px solid #d1d5db;
      border-radius: 20px;
      padding: 0 25px;
      font-size: 27px;
      outline: none;
    }

    input:focus {
      border-color: #15803d;
      box-shadow: 0 0 0 3px rgba(21, 128, 61, 0.12);
    }

    .track-button {
      width: 100%;
      height: 95px;
      margin-top: 25px;
      border: none;
      border-radius: 20px;
      background: #15803d;
      color: white;
      font-size: 28px;
      font-weight: 800;
      cursor: pointer;
    }

    .track-button:active {
      transform: scale(0.99);
    }

    .message {
      text-align: center;
      color: #c62828;
      font-size: 21px;
      margin: 25px 0 0;
    }

    .result {
      position: relative;
      margin-top: 30px;
      background: white;
      border-radius: 25px;
      padding: 35px 30px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    }

    .hidden {
      display: none;
    }

    .close-result {
      position: absolute;
      right: 18px;
      top: 18px;
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 50%;
      background: #f1f5f9;
      color: #334155;
      font-size: 28px;
      cursor: pointer;
    }

    .result h2 {
      font-size: 28px;
      margin-bottom: 25px;
    }

    .result h3 {
      font-size: 22px;
      margin-top: 30px;
      margin-bottom: 18px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 15px 0;
      border-bottom: 1px solid #e5e7eb;
      font-size: 17px;
    }

    .key {
      color: #64748b;
      font-weight: 600;
      min-width: 145px;
    }

    .value {
      text-align: right;
      font-weight: 700;
      max-width: 65%;
      word-break: break-word;
    }

    .status {
      display: inline-block;
      padding: 7px 14px;
      border-radius: 20px;
      background: #dcfce7;
      color: #166534;
      font-size: 14px;
    }

    .transit-status {
      background: #fef3c7;
      color: #92400e;
    }

    .address-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 18px;
      line-height: 1.6;
      color: #334155;
      font-size: 16px;
    }

    .tracking {
      margin-top: 20px;
    }

    .step {
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }

    .step-icon {
      width: 30px;
      height: 30px;
      min-width: 30px;
      border-radius: 50%;
      background: #15803d;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
    }

    .step.current .step-icon {
      background: #f59e0b;
    }

    .step-text strong {
      display: block;
      font-size: 17px;
    }

    .step-text small {
      display: block;
      color: #64748b;
      margin-top: 4px;
    }

    .line {
      height: 30px;
      border-left: 3px solid #d1d5db;
      margin-left: 14px;
    }

    .distance-box {
      margin-top: 25px;
      padding: 20px;
      background: #f8fafc;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
    }

    .distance-title {
      font-size: 19px;
      font-weight: 800;
      margin-bottom: 15px;
    }

    .distance-track {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 700;
    }

    .distance-bar {
      flex: 1;
      height: 9px;
      background: #d1d5db;
      border-radius: 20px;
      position: relative;
    }

    .distance-fill {
      width: 25%;
      height: 100%;
      background: #15803d;
      border-radius: 20px;
    }

    .distance-box p {
      color: #64748b;
      margin-bottom: 0;
      font-size: 14px;
    }

    .footer {
      text-align: center;
      color: #64748b;
      margin-top: 45px;
      line-height: 1.7;
    }

    @media (max-width: 600px) {

      .container {
        padding: 35px 15px 25px;
      }

      .brand {
        font-size: 36px;
      }

      h1 {
        font-size: 40px;
      }

      .subtitle {
        font-size: 21px;
      }

      .track-box {
        padding: 30px 20px 25px;
        border-radius: 25px;
      }

      label {
        font-size: 22px;
      }

      input,
      .track-button {
        height: 80px;
        font-size: 23px;
      }

      .row {
        flex-direction: column;
        gap: 6px;
      }

      .value {
        max-width: 100%;
        text-align: left;
      }

      .key {
        min-width: auto;
      }
    }
  </style>
</head>

<body>

<main class="container">

  <!-- BRAND -->
  <div class="brand">
    🎁 <span>Hamper Box</span>
  </div>

  <!-- TITLE -->
  <h1>Parcel Tracking</h1>

  <p class="subtitle">
    Enter your registered mobile number to track your
    Hamper Box parcel.
  </p>


  <!-- SEARCH BOX -->
  <section class="track-box">

    <label for="mobile">
      Mobile Number
    </label>

    <input
      id="mobile"
      type="tel"
      inputmode="numeric"
      maxlength="10"
      autocomplete="tel"
      placeholder="Enter 10 digit mobile number"
      oninput="this.value=this.value.replace(/\D/g,'').slice(0,10)"
    >

    <button
      type="button"
      class="track-button"
      onclick="trackParcel()"
    >
      Track Parcel
    </button>

    <p id="message" class="message"></p>

  </section>


  <!-- RESULT -->
  <section
    id="result"
    class="result hidden"
    aria-live="polite">
  </section>


  <!-- FOOTER -->
  <footer class="footer">
    <div>🎁 Hamper Box</div>
    <small>Parcel Tracking System</small>
  </footer>

</main>


<script>

  /* ==============================
     S. KALAIVANI PARCEL DATA
     ============================== */

  const parcel = {

    name: "S.Kalaivani",

    mobile: "9597561211",

    parcelId: "GH959756",

    project: "Hamper Box Parcel",

    courier: "GiftHub Delivery",

    dispatchLocation: "Tamil Nadu",

    route: "Namakkal → Chennai",

    payment: "Prepaid",

    status: "In Transit",

    distance: "20 KM",

    expected: "05 September 2026",

    updated: "05 September 2026, 10:00 AM",

    address: {

      house:
        "2/173, Old Post Office Opposite, Vaiyappamalai Road, Velagoundampatti",

      street:
        "Velagoundampatti",

      landmark:
        "Old Post Office Opposite, Vaiyappamalai Road, Velagoundampatti, Namakkal",

      city:
        "Namakkal",

      state:
        "Tamil Nadu",

      pin:
        "637212",

      country:
        "India"

    }

  };


  /* ==============================
     TRACK PARCEL
     ============================== */

  function trackParcel() {

    const input =
      document.getElementById("mobile");

    const mobile =
      input.value.replace(/\D/g, "");

    const message =
      document.getElementById("message");

    const result =
      document.getElementById("result");


    result.classList.add("hidden");

    message.textContent = "";


    if (mobile.length !== 10) {

      message.textContent =
        "Please enter a valid 10 digit mobile number.";

      return;

    }


    if (mobile !== parcel.mobile) {

      message.textContent =
        "No parcel found for this mobile number.";

      return;

    }


    result.innerHTML = `

      <button
        class="close-result"
        onclick="closeResult()"
        aria-label="Close"
      >
        ×
      </button>


      <h2>
        📦 Parcel Details
      </h2>


      <div class="row">
        <span class="key">Name</span>
        <span class="value">
          ${parcel.name}
        </span>
      </div>


      <div class="row">
        <span class="key">Mobile</span>
        <span class="value">
          ${parcel.mobile}
        </span>
      </div>


      <div class="row">
        <span class="key">Parcel ID</span>
        <span class="value">
          ${parcel.parcelId}
        </span>
      </div>


      <div class="row">
        <span class="key">Project</span>
        <span class="value">
          ${parcel.project}
        </span>
      </div>


      <div class="row">
        <span class="key">Courier</span>
        <span class="value">
          ${parcel.courier}
        </span>
      </div>


      <div class="row">
        <span class="key">Dispatch Location</span>
        <span class="value">
          ${parcel.dispatchLocation}
        </span>
      </div>


      <div class="row">
        <span class="key">Route</span>
        <span class="value">
          ${parcel.route}
        </span>
      </div>


      <div class="row">
        <span class="key">Payment</span>
        <span class="value">
          <span class="status">
            ${parcel.payment}
          </span>
        </span>
      </div>


      <div class="row">
        <span class="key">Status</span>
        <span class="value">
          <span class="status transit-status">
            ${parcel.status}
          </span>
        </span>
      </div>


      <div class="row">
        <span class="key">Current Progress</span>
        <span class="value">
          ${parcel.distance} Travelled
        </span>
      </div>


      <div class="row">
        <span class="key">Expected Delivery</span>
        <span class="value">
          ${parcel.expected}
        </span>
      </div>


      <div class="row">
        <span class="key">Last Updated</span>
        <span class="value">
          ${parcel.updated}
        </span>
      </div>


      <h3>
        🏠 Delivery Address
      </h3>


      <div class="address-box">

        <strong>House / Flat No.:</strong><br>
        ${parcel.address.house}

        <br><br>

        <strong>Street / Area:</strong><br>
        ${parcel.address.street}

        <br><br>

        <strong>Landmark:</strong><br>
        ${parcel.address.landmark}

        <br><br>

        <strong>City:</strong>
        ${parcel.address.city}

        <br>

        <strong>State:</strong>
        ${parcel.address.state}

        <br>

        <strong>PIN Code:</strong>
        ${parcel.address.pin}

        <br>

        <strong>Country:</strong>
        ${parcel.address.country}

      </div>


      <h3>
        📍 Tracking Progress
      </h3>


      <div class="tracking">

        <div class="step">

          <div class="step-icon">
            ✓
          </div>

          <div class="step-text">

            <strong>
              Order Confirmed
            </strong>

            <small>
              Order successfully confirmed
            </small>

          </div>

        </div>


        <div class="line"></div>


        <div class="step">

          <div class="step-icon">
            ✓
          </div>

          <div class="step-text">

            <strong>
              Parcel Prepared
            </strong>

            <small>
              Parcel packed and ready
            </small>

          </div>

        </div>


        <div class="line"></div>


        <div class="step">

          <div class="step-icon">
            ✓
          </div>

          <div class="step-text">

            <strong>
              Dispatched
            </strong>

            <small>
              Dispatched from Tamil Nadu
            </small>

          </div>

        </div>


        <div class="line"></div>


        <div class="step current">

          <div class="step-icon">
            ●
          </div>

          <div class="step-text">

            <strong>
              In Transit
            </strong>

            <small>
              ${parcel.distance} from dispatch point
            </small>

          </div>

        </div>

      </div>


      <div class="distance-box">

        <div class="distance-title">
          🚚 Current Parcel Movement
        </div>


        <div class="distance-track">

          <span>
            Dispatch
          </span>


          <div class="distance-bar">

            <div class="distance-fill"></div>

          </div>


          <span>
            20 KM
          </span>

        </div>


        <p>
          Parcel progress: <b>20 KM</b>
          from the dispatch point.
        </p>

      </div>

    `;


    result.classList.remove("hidden");

  }


  /* ==============================
     CLOSE RESULT
     ============================== */

  function closeResult() {

    document
      .getElementById("result")
      .classList.add("hidden");

  }


  /* ==============================
     ENTER KEY SUPPORT
     ============================== */

  document
    .getElementById("mobile")
    .addEventListener("keydown", function(event) {

      if (event.key === "Enter") {

        trackParcel();

      }

    });

</script>

</body>
</html>
